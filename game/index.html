<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier: Ring Run</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1626; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #79a6d2; box-shadow: 0 0 0 2px #1d2f47; }
  #hint { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
          color: #dfeaf5; font: 13px/1.5 system-ui, sans-serif; text-align: center;
          text-shadow: 0 1px 3px rgba(0,0,0,.7); pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="hint">Sky Courier: Ring Run &mdash; click the game, then fly with the keys shown on screen.</div>
<script src="src/rng.js"></script>
<script src="src/world.js"></script>
<script src="src/plane.js"></script>
<script src="src/render.js"></script>
<script src="src/hud.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
